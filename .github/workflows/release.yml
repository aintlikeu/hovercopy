# Builds HoverCopy.exe on Windows.
# - Push a tag vX.Y.Z (equal to the version in Cargo.toml): tests, build, GitHub release with the exe.
# - Run manually (Actions → Release → Run workflow): tests and build; the exe is attached to the
#   run as an artifact, no release is made.
# The build job, which runs third-party code (actions, crates), has a read-only token; only the
# release job, with no third-party actions, may write. Actions are pinned to commits.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same version in Cargo.toml, app.rc and app.manifest, and in the tag on a release.
      - name: Versions match
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $rc = $v -replace '\.', ','
          $checks = @(
            @{ file = 'assets/app.rc'; text = "FILEVERSION $rc,0" },
            @{ file = 'assets/app.rc'; text = "VALUE ""ProductVersion"", ""$v""" },
            @{ file = 'assets/app.manifest'; text = "version=""$v.0""" }
          )
          $bad = $env:GITHUB_REF_TYPE -eq 'tag' -and $env:TAG -ne "v$v"
          if ($bad) { Write-Output "::error::Tag $env:TAG does not match version $v in Cargo.toml" }
          foreach ($c in $checks) {
            if (-not (Select-String -Path $c.file -SimpleMatch $c.text -Quiet)) {
              Write-Output "::error::$($c.file) does not contain: $($c.text)"
              $bad = $true
            }
          }
          if ($bad) { exit 1 }
          Write-Output "Version $v"

      - name: Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Tests
        run: cargo test --locked --profile fast

      - name: Build
        shell: pwsh
        run: |
          cargo build --locked --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/HoverCopy.exe dist/
          $hash = (Get-FileHash dist/HoverCopy.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  HoverCopy.exe" | Out-File -Encoding ascii -NoNewline dist/HoverCopy.exe.sha256
          Get-ChildItem dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HoverCopy
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HoverCopy
          path: dist

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/HoverCopy.exe dist/HoverCopy.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "HoverCopy $TAG" --generate-notes
