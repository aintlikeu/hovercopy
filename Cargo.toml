[package]
name = "hover-copy"
version = "1.2.0"
edition = "2021"
description = "Copies the word under the mouse cursor to the clipboard (global hotkey + local OCR)"
license = "Apache-2.0"
repository = "https://github.com/aintlikeu/hovercopy"
publish = false

[lib]
name = "hover_copy"
path = "src/lib.rs"

[[bin]]
name = "HoverCopy"
path = "src/main.rs"

[dependencies]
tract-onnx = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

# Shipping build: small single exe. Size-optimized except tract's compute kernels.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.release.package.tract-linalg]
opt-level = 3

# Same code for tests on the dev machine, without the long LTO link.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[profile.fast.package.tract-linalg]
opt-level = 3
